# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained but has no known vulnerability; it is a
    # compile-time macro pulled in by ratatui 0.29. ratatui 0.30 drops it but
    # requires Rust 1.88, above this crate's MSRV.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, no vulnerability; ratatui 0.29 build-time dependency" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
