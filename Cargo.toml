[package]
name = "home-network-ids"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
authors = ["Bekirhan Karakurt"]
description = "Home network intrusion detection for Linux: port scans, ARP spoofing, rogue devices and DNS anomalies from raw sockets or pcap files."
license = "MIT"
repository = "https://github.com/bekirhankarakurt/home-network-ids"
readme = "README.md"
keywords = ["ids", "network", "security", "pcap", "arp"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["docs/demo.gif"]

[[bin]]
name = "hnids"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
verbose_bit_mask = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
